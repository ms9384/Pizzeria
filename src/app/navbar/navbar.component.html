<!-- Navbar -->
<nav class="navbar">
   <div class="logo-name">
        <p routerLink="/splash">Pizzeria</p>
    </div>

    <div class="logo-img">
        <img src="assets/images/PIZZERIA-LOGO.png" title="pizzeria logo" routerLink="/home">
    </div>
    
    <div class="nav-links">
        <a routerLink="/order-pizza">Order Pizza</a>
        <a routerLink="/build-pizza">Build Ur Pizza</a>
   </div>

   <div class="nav-cart-btn">
    <button
        class="shopping-cart-btn"
        routerLink="/cart">

        <img
            [src]="isCartPage()
            ? 'assets/images/cart-black.png'
            : 'assets/images/cart-white.png'"
            class="cart-icon">

        <span
            [class.black-text]="isCartPage()">

            Shopping Cart

        </span>

        <span class="cart-count">

            {{ cartService.getCartCount() }}

        </span>

        </button>
   </div>
</nav>
